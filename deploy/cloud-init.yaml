#cloud-config
# Runs once on the Linode's first boot: installs Docker and makes the app folder.
# No secrets in here. .env is copied over SSH by deploy/deploy.sh.
package_update: true
packages:
  - docker.io
  - docker-compose-v2
ssh_pwauth: false
runcmd:
  - systemctl enable --now docker
  - mkdir -p /opt/tripwright
