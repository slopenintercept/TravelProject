<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Direction C — options</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: grid; grid-template-rows: auto 1fr; font: 500 14px/1.4 ui-sans-serif, system-ui, sans-serif; background: #18181b; color: #f4f4f5; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding: 10px 16px; }
  header b { font-weight: 650; }
  .group { display: flex; align-items: center; gap: 8px; }
  .group > span { color: #a1a1aa; font-size: 13px; }
  .set { display: flex; padding: 3px; border-radius: 9px; background: #27272a; }
  .set button { height: 30px; padding: 0 12px; border: 0; border-radius: 7px; background: none; color: #d4d4d8; font: inherit; cursor: pointer; white-space: nowrap; }
  .set button.on { background: #f4f4f5; color: #18181b; }
  .grow { flex: 1; }
  header a { color: #d4d4d8; }
  main { min-height: 0; overflow: auto; }
  main.single { overflow: hidden; }
  main.single iframe { width: 100%; height: 100%; border: 0; display: block; }
  /* Compare: every option of one kind at once, each a real 1360x900 page scaled down to fit its cell. */
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; padding: 4px 16px 16px; }
  .cell { cursor: pointer; }
  .cell h2 { margin: 0 0 6px; font-size: 14px; font-weight: 600; }
  .cell h2 small { font-weight: 400; color: #a1a1aa; margin-left: 8px; font-size: 13px; }
  .shot { position: relative; overflow: hidden; border-radius: 10px; aspect-ratio: 1360 / 900; background: #27272a; }
  .shot iframe { position: absolute; inset: 0 auto auto 0; width: 1360px; height: 900px; border: 0; transform-origin: 0 0; pointer-events: none; }
</style>
</head>
<body>
<header>
  <b>Direction C</b>
  <span id="groups" style="display:contents"></span>
  <span class="grow"></span>
  <a id="open" target="_blank">Open full page</a>
</header>
<main id="main"></main>
<script>
  // Each group is one thing you can vary. The first option of "compare" groups shows all the others side by side.
  const GROUPS = [
    { key: 'run', label: 'Run', options: [['done', 'Finished'], ['live', 'Re-planning (example)']] },
    { key: 'screen', label: 'Screen', options: [['start', 'Start'], ['picks', 'Picks'], ['review', 'Review']] },
  ]
  const state = { run: 'done', screen: 'review' }
  const main = document.getElementById('main'), open = document.getElementById('open')

  const url = (over = {}) => {
    const s = { ...state, ...over }
    const query = GROUPS.filter((g) => g.key !== 'screen' && !['all', 'none', 'done'].includes(s[g.key])).map((g) => `${g.key}=${s[g.key]}`).join('&')
    return `direction-c-lilac.html?${query}#${s.screen}`
  }

  function render() {
    document.getElementById('groups').innerHTML = GROUPS.map((g) => `
      <span class="group"><span>${g.label}</span><span class="set" data-key="${g.key}">
        ${g.compare ? `<button data-v="all" class="${state[g.key] === 'all' ? 'on' : ''}">Compare all</button>` : ''}
        ${g.options.map(([v, name]) => `<button data-v="${v}" class="${state[g.key] === v ? 'on' : ''}">${name}</button>`).join('')}
      </span></span>`).join('')

    const comparing = GROUPS.find((g) => state[g.key] === 'all')
    main.className = comparing ? '' : 'single'
    if (!comparing) {
      main.innerHTML = `<iframe title="Direction C" src="${url()}"></iframe>`
      open.href = url()
      return
    }
    main.innerHTML = `<div class="grid">${comparing.options.map(([v, name, note]) => `
      <section class="cell" data-key="${comparing.key}" data-v="${v}">
        <h2>${name}<small>${note ?? ''}</small></h2>
        <div class="shot"><iframe title="${name}" src="${url({ [comparing.key]: v })}"></iframe></div>
      </section>`).join('')}</div>`
    open.href = url({ [comparing.key]: comparing.options[0][0] })
    fit()
    // A frame opening at its #screen anchor scrolls this page to it; put the grid back at the top.
    main.querySelectorAll('iframe').forEach((frame) => frame.addEventListener('load', () => { main.scrollTop = 0 }))
  }

  function fit() {
    document.querySelectorAll('.shot').forEach((shot) => {
      shot.firstElementChild.style.transform = `scale(${shot.clientWidth / 1360})`
    })
  }
  addEventListener('resize', fit)

  document.addEventListener('click', (e) => {
    const pick = e.target.closest('.set button, .cell')
    if (!pick) return
    const key = pick.dataset.key ?? pick.parentElement.dataset.key
    // Only one group is compared at a time: comparing a second one settles the first on its first option.
    if (pick.dataset.v === 'all') for (const g of GROUPS) if (state[g.key] === 'all') state[g.key] = g.options[0][0]
    state[key] = pick.dataset.v
    render()
  })
  render()
</script>
</body>
</html>
